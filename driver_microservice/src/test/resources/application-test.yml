
spring:
  h2:
    console:
      enabled: true

  datasource:
    url: jdbc:h2:mem:testDb
    driver-class-name: org.h2.Driver
    username: tony
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        show_sql: true
        use_sql_comments: false
        format_sql: false