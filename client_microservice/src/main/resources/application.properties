spring.config.import=optional:file:.../../.env[.properties],optional:file:./.env[.properties]
spring.application.name=client_microservice

#Datasource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

#JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

#Security
spring.security.user.name=tony
spring.security.user.password={noop}1234

#Flyway

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.springframework.boot.context.config=DEBUG
logging.level.com.tony.user_microservice=DEBUG
logging.level.org.springframework.security=DEBUG
server.port=8020

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION:604800000}
