spring:
  application:
    name: registry-service

eureka:
  instance:
    hostname: localhost
  client:
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

server:
  port: 8077

management:
  endpoints:
    web:
      exposure:
        include: "*"
